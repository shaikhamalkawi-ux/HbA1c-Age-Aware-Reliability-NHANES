name: Repository integrity
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Regenerate public bookkeeping
        if: github.ref == 'refs/heads/checkpoint-2-adjudicated'
        run: python3 scripts/regenerate_public_metadata.py
      - name: Commit regenerated bookkeeping
        if: github.ref == 'refs/heads/checkpoint-2-adjudicated'
        run: |
          if ! git diff --quiet -- verification/public_allowlist.json verification/public_content_report.json SHA256SUMS.txt; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add verification/public_allowlist.json verification/public_content_report.json SHA256SUMS.txt
            git commit -m 'Regenerate public manifest and allowlist [skip ci]'
            git push
          fi
      - name: Verify exact manifest
        run: python3 scripts/verify_manifest.py
      - name: Screen current public content
        run: python3 scripts/check_public_content.py
      - name: Check original checkpoint report identities
        run: python3 scripts/check_verification_report.py
      - name: Check final adjudicated scientific summary
        run: python3 scripts/check_final_scientific_summary.py
      - name: Screen complete reachable history
        run: python3 scripts/scan_git_history.py
